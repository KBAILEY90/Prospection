name: Run Prospection Script - Shard 1

# One of 4 parallel scraper shards. Each shard owns a disjoint slice of the
# address space (via SHARD_INDEX/SHARD_COUNT in 2.Prospection.py, hashed
# deterministically per-address) so shards never process the same address.
# This workflow started as the manual-only canary-test.yml, which proved
# (Jul 17 2026) that Sherbrooke's hourly rate limit is scoped per-runner,
# not shared -- see CLAUDE.md "Parallel scraper shards" for the full
# reasoning and the incremental scale-up plan.

on:
  schedule:
    - cron: '15 */1 * * *' # Every hour, offset 15m from shard 0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospection-shard-1
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libspatialindex-dev
          pip install -r requirements.txt

      - name: Run script
        run: python "2.Prospection.py"
        env:
          SHARD_INDEX: '1'
          SHARD_COUNT: '4'

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/Liste_Prospection.csv" "data/Adresses_Inaccessibles.csv"
          git commit -m "Auto-save progress (shard 1)" || echo "No changes to commit"
          git pull --no-rebase -s recursive -X union && git push || echo "Push failed — will retry next run"
