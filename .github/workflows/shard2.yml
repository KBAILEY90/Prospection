name: Run Prospection Script - Shard 2

# One of 4 parallel scraper shards -- see shard1.yml header and CLAUDE.md
# "Parallel scraper shards" for the design rationale.

on:
  schedule:
    - cron: '30 */1 * * *' # Every hour, offset 30m from shard 0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prospection-shard-2
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libspatialindex-dev
          pip install -r requirements.txt

      - name: Run script
        run: python "2.Prospection.py"
        env:
          SHARD_INDEX: '2'
          SHARD_COUNT: '4'

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/Liste_Prospection.csv" "data/Adresses_Inaccessibles.csv"
          git commit -m "Auto-save progress (shard 2)" || echo "No changes to commit"
          git pull --no-rebase -s recursive -X union && git push || echo "Push failed — will retry next run"
