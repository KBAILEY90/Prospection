name: Retry Inaccessibles

on:
  schedule:
    - cron: '30 */2 * * *'  # Every 2 hours, offset from main scraper
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retry-inaccessibles
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable

      - name: Install Python dependencies
        run: pip install selenium webdriver-manager pandas

      - name: Run retry script
        run: python 3.Retry_Inaccessibles.py

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/Liste_Prospection.csv" "data/Adresses_Inaccessibles.csv"
          git commit -m "Retry inaccessibles — auto-update CSVs" || echo "No changes to commit"
          git pull --rebase && git push || echo "Push failed — will retry next run"
