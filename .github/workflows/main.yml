name: Run Prospection Script

on:
  schedule:
    - cron: '0 */1 * * *' # Every hour
  workflow_dispatch:

permissions:
  contents: write

# Only one run at a time -- queue rather than cancel so no work is lost
concurrency:
  group: prospection-scraper
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true # Needed for commit + push

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libspatialindex-dev
          pip install -r requirements.txt

      - name: Run scraper (phase-aware, shard 0)
        env:
          SHARD_INDEX: "0"
          SHARD_COUNT: "2"
        run: |
          PHASE=$(python phase.py)
          echo "Detected phase: $PHASE"
          if [ "$PHASE" = "retry" ]; then
            python "3.Retry_Inaccessibles.py"
          else
            python "2.Prospection.py"
          fi

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/Liste_Prospection.csv" "data/Adresses_Inaccessibles.csv"
          git commit -m "Auto-save progress" || echo "No changes to commit"
          git pull --no-rebase -s recursive -X union && git push || echo "Push failed — will retry next run"
